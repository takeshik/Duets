name: Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: /home/runner/.nuget/packages

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      packages: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # required for Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Set release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "DUETS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: 2.4.16

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore --locked-mode --verbosity normal

      - name: Check code format
        run: dotnet run scripts/format-check.cs

      - name: Check documentation
        run: dotnet run scripts/docs-check.cs

      - name: Check ADR structure (no semantic validation)
        shell: bash
        run: |
          set -euo pipefail
          args=()
          # main carries no Proposed record; drafting and review happen before a push to it.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            args+=(--no-proposed)
          fi
          base=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            # No base exists (workflow_dispatch, tag, or the first push of a ref): static rules only.
            dotnet run scripts/adr-check.cs -- ${args[@]+"${args[@]}"}
          elif git cat-file -e "${base}^{commit}" 2>/dev/null; then
            dotnet run scripts/adr-check.cs -- --base "$base" ${args[@]+"${args[@]}"}
          else
            echo "The event names base $base but it is not reachable; refusing to skip the change rules." >&2
            exit 1
          fi

      - name: Self-test ADR check
        run: dotnet run scripts/adr-check.cs -- --self-test

      - name: Build
        run: dotnet build --no-restore -c Release --verbosity normal

      - name: Resolve latest JS asset versions
        run: |
          BABEL_VER=$(curl -sf https://registry.npmjs.org/%40babel%2Fstandalone/latest | jq -r .version)
          TS_VER=$(curl -sf https://registry.npmjs.org/typescript/latest | jq -r .version)
          echo "BABEL_VERSION=$BABEL_VER" >> "$GITHUB_ENV"
          echo "TS_VERSION=$TS_VER" >> "$GITHUB_ENV"

      - name: Cache JS test assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/duets-test-assets
          key: test-assets-babel-${{ env.BABEL_VERSION }}-ts-${{ env.TS_VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release -- --report-trx

      - name: Report test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: xUnit Tests
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      - name: Pack (release)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: dotnet pack --no-build -c Release -o ./artifacts

      - name: Select snapshot projects
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          projects=(
            src/Duets/Duets.csproj
            src/Duets.Jint/Duets.Jint.csproj
            src/Duets.Pad/Duets.Pad.csproj
            src/HttpHarker/HttpHarker.csproj
          )
          selected=()
          before="${{ github.event.before }}"

          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "${before}^{commit}"; then
            selected=("${projects[@]}")
          else
            common_changed=false
            if ! git diff --quiet "$before" "$GITHUB_SHA" -- \
              version.json \
              Directory.Build.props \
              global.json \
              key.snk \
              src/shared; then
              common_changed=true
            fi

            for project in "${projects[@]}"; do
              project_directory="${project%/*}"
              if [[ "$common_changed" == true ]] || \
                ! git diff --quiet "$before" "$GITHUB_SHA" -- "$project_directory"; then
                selected+=("$project")
              fi
            done
          fi

          echo "SNAPSHOT_PROJECTS=${selected[*]}" >> "$GITHUB_ENV"

      - name: Pack (snapshot)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && env.SNAPSHOT_PROJECTS != ''
        shell: bash
        run: |
          set -euo pipefail
          for project in $SNAPSHOT_PROJECTS; do
            dotnet pack "$project" --no-build -c Release -o ./artifacts
          done

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || env.SNAPSHOT_PROJECTS != '')
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
