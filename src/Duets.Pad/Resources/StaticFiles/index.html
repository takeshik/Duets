        </div>

        <div class="vr toolbar-divider"></div>

        <div class="btn-list">
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary"
            id="btn-run"
            title="Run (Ctrl/Cmd+Enter)"
          >
            <i class="ti ti-player-play"></i>
          </button>
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary"
            id="btn-clear"
            title="Clear timeline"
          >
            <i class="ti ti-eraser"></i>
          </button>
        </div>

        <div class="toolbar-spacer"></div>

        <div
          class="btn-group seg-panes"
          id="seg-panes"
          role="group"
          aria-label="Show / hide panes"
        >
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary active"
            data-pane="editor"
            title="Editor"
          >
            <i class="ti ti-code"></i>
          </button>
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary active"
            data-pane="canvas"
            title="Canvas"
          >
            <i class="ti ti-layout-dashboard"></i>
          </button>
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary active"
            data-pane="timeline"
            title="Timeline + Immediate"
          >
            <i class="ti ti-timeline-event"></i>
          </button>
        </div>

        <div
          class="btn-group seg-view"
          id="seg-view"
          role="group"
          aria-label="Workspace arrangement"
        >
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary active"
            data-arrange="vertical"
            title="Split vertically — editor beside results"
          >
            <i class="ti ti-layout-columns"></i>
          </button>
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary"
            data-arrange="horizontal"
            title="Split horizontally — editor above results"
          >
            <i class="ti ti-layout-rows"></i>
          </button>
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary"
            data-arrange="tabs"
            title="Tabs — one pane fullscreen"
          >
            <i class="ti ti-layout-navbar"></i>
          </button>
        </div>

        <button
          type="button"
          class="btn btn-icon btn-ghost-secondary"
          id="btn-theme"
          title="Toggle light / dark"
        >
          <i class="ti ti-moon"></i>
        </button>

        <span
          id="session-status"
          class="status status-yellow session-status"
          title="Session status"
        >
          <span class="status-dot status-dot-animated"></span>
          <span class="session-label">connecting</span>
          <div class="session-popup"></div>
        </span>

        <div class="dropdown" id="dropdown-more">
          <button
            type="button"
            class="btn btn-icon btn-ghost-secondary"
            id="btn-more"
            title="More"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <i class="ti ti-dots-vertical"></i>
          </button>
          <div class="dropdown-menu dropdown-menu-end" id="menu-more">
            <button type="button" class="dropdown-item" id="menu-reset-session">
              <i class="ti ti-refresh-alert me-2"></i>Reset session
            </button>
          </div>
        </div>
      </header>

      <!-- Tab bar (only visible in 'tabs' view) -->
      <ul class="nav nav-tabs workspace-tabbar" id="workspace-tabbar"></ul>

      <!-- Workspace (panes are reorganised by duetspad-ui.js per layout) -->
      <div class="workspace" id="workspace">
        <section class="pane" id="pane-editor">
          <div class="pane-head">
            <i class="ti ti-code pane-icon"></i>
            <span class="pane-title">Editor</span>
            <span class="pane-sub"></span>
          </div>
          <div id="editor-host"></div>
        </section>

        <section class="pane" id="pane-canvas">
          <div class="pane-head">
            <i class="ti ti-layout-dashboard pane-icon"></i>
            <span class="pane-title">Canvas</span>
            <ul class="canvas-tabbar" id="canvas-tabbar"></ul>
            <div class="pane-tools btn-list">
              <button
                type="button"
                class="btn btn-icon btn-sm btn-ghost-secondary"
                title="Refresh"
              >
                <i class="ti ti-refresh"></i>
              </button>
            </div>
          </div>
          <div id="canvas-panels"></div>
        </section>

        <section class="pane" id="pane-timeline">
          <div class="pane-head">
            <i class="ti ti-timeline-event pane-icon"></i>
            <span class="pane-title">Timeline</span>
            <div class="pane-tools btn-list">
              <button
                type="button"
                class="btn btn-icon btn-sm btn-ghost-secondary"
                title="Clear"
              >
                <i class="ti ti-eraser"></i>
              </button>
            </div>
          </div>
          <div id="timeline-content"></div>
          <!-- Immediate console -->
          <div class="immediate-console">
            <div class="immediate-bar">
              <span class="immediate-prompt" title="Immediate">›</span>
              <div id="immediate-input" class="immediate-editor"></div>
            </div>
          </div>
        </section>
      </div>

      <!-- Status line -->
      <div class="statusline">
        <div id="editor-status"></div>
      </div>
    </div>

    <div id="dialog-container"></div>

    <!-- Toast container — positioned top-end, above panes (z-index from .toast-container) -->
    <div
      id="toast-container"
      class="toast-container position-fixed top-0 end-0 p-3"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script src="duetspad-config.js"></script>
    <script src="monaco-loader.js"></script>
    <script src="tagged-template-completion.js"></script>
    <script src="duetspad.js"></script>
    <script src="duetspad-ui.js"></script>
  </body>
</html>
